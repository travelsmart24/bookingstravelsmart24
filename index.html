<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Travelsmart24 Taxi & Tour Booking Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--g:#1f7a3f;--gd:#14572c;--o:#f57c00;--bg:#f4f7f4;--c:#fff;--t:#1d2a22;--m:#667;--b:#dde5de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101712;--c:#1a241d;--t:#e8f0ea;--m:#9aa8a0;--b:#2c3a30}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header img{height:42px;border-radius:6px}header h1{font-size:17px;margin:0;line-height:1.2}header small{opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--c);border-bottom:2px solid var(--o);position:sticky;top:0;z-index:5}
nav button{flex:none;border:0;background:transparent;color:var(--t);font-size:15px;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--g);color:#fff}
main{max-width:1050px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.stat{border-left:5px solid var(--g)}.stat.o{border-color:var(--o)}.stat b{display:block;font-size:22px}.stat span{color:var(--m);font-size:13px}
h2{font-size:19px;margin:6px 0 10px}h3{font-size:16px;margin:12px 0 6px;color:var(--g)}
label{display:block;font-size:13px;font-weight:600;color:var(--m);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)}
textarea{min-height:64px}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.btn{border:0;background:var(--g);color:#fff;font:inherit;font-weight:700;padding:13px 20px;border-radius:12px;cursor:pointer}
.btn.o{background:var(--o)}.btn.l{background:transparent;color:var(--g);border:2px solid var(--g)}.btn.r{background:#c62828}.btn.s{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--b);vertical-align:top}th{color:var(--m);font-size:12px;text-transform:uppercase}
.wrap{overflow-x:auto}.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e3f1e7;color:var(--gd)}
.tag.o{background:#ffe9d2;color:#a85200}.tag.x{background:#fde0e0;color:#a31515}.tag.n{background:#e6e9ee;color:#445}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;overflow:auto;z-index:20;padding:12px}
#modal>div{max-width:780px;margin:0 auto;background:var(--c);border-radius:14px;padding:16px}
.doc{border:2px solid var(--g);border-radius:10px;padding:16px;background:#fff;color:#111}.doc h2{color:var(--g);margin:0}
.doc table td{border-bottom:1px solid #e5e5e5;color:#111}.doc td:first-child{color:#555;width:38%}.doc small{color:#444}
.dh{display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--o);padding-bottom:8px;margin-bottom:8px}.dh img{height:54px}
.msg{padding:30px;text-align:center;color:var(--m)}.muted{color:var(--m);font-size:13px}
@media print{body *{visibility:hidden}.doc,.doc *{visibility:visible}.doc{position:absolute;left:0;top:0;width:100%;border:0}#modal{position:static;background:none}}
.doc{padding:0;overflow:hidden;border-radius:12px}
.top{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#14572c,#1f7a3f);color:#fff;padding:14px}
.top img{height:62px;border-radius:8px;background:#fff}.tt{flex:1}.co{font-size:19px;font-weight:800;line-height:1.2}.sub{font-size:12px;opacity:.9}
.bid{text-align:right}.bid b{display:block;font-size:18px;color:#ffd08a}.bid small{display:block;font-size:11px;opacity:.9}
.ttl{background:#f57c00;color:#fff;font-weight:800;letter-spacing:1.5px;text-align:center;padding:7px;font-size:14px}
.bd{padding:14px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));column-gap:12px}
.sec{margin-bottom:12px;border:1px solid #e3e8e4;border-radius:10px;overflow:hidden}.sec h4{margin:0;padding:6px 10px;background:#e8f3ec;color:#14572c;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-top:1px solid #eef1ee;font-size:14px;color:#111}.kv span{color:#666}.kv b{text-align:right;font-weight:600}
.kv.tot b{font-size:16px}.kv.big{background:#fff3e6}.kv.big b{color:#c25e00;font-size:18px}
.terms{font-size:11px;color:#444;border-top:2px dashed #ccc;padding-top:8px}.foot{background:#14572c;color:#fff;text-align:center;padding:10px;font-size:13px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.dbox{background:var(--c);border-radius:14px;padding:18px;max-width:380px;width:100%}.dbox p{margin:0 0 8px;font-size:16px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#14572c;color:#fff;padding:12px 14px;border-radius:12px;z-index:60;display:none;max-width:520px;margin:0 auto;font-size:15px}
</style></head><body>

<nav id="nav"></nav><main id="app"><div class="msg">Loading…</div></main><div id="modal"></div><div id="dlg"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dfmt=s=>s?new Date(s.length>10?s:s+'T00:00').toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',...(s.length>10?{hour:'2-digit',minute:'2-digit'}:{})}):'';
const STATUS=['New Booking','Confirmed','Vehicle Assigned','Trip Started','Trip Completed','Cancelled'];
const TRIPS=['One Way','Round Trip','Local','Outstation','Tour Package','Airport Transfer'],VTYPES=['Etios','Swift Dzire','Innova','Innova Crysta','Tempo Traveller','Urbania','Other'];
const METHODS=['Cash','Google Pay','PhonePe','Bank Transfer','UPI'];
let S={tab:'dash',B:[],V:[],D:[],q:'',fb:'',ft:'',rm:today().slice(0,7),rd:today()},DB=null,DL=null;
const tabs=[['dash','Dashboard'],['new','+ New Booking'],['list','Bookings'],['veh','Vehicles'],['drv','Drivers'],['cust','Customers'],['rep','Reports']];
const grand=b=>(+b.total||0)+(+b.bata||0)+(+b.toll||0)+(+b.extra||0),paid=b=>(b.payments||[]).reduce((a,p)=>a+(+p.amount||0),0),bal=b=>grand(b)-paid(b);
const pstat=b=>{const p=paid(b);return p<=0?'Pending':p>=grand(b)&&grand(b)>0?'Fully Paid':(b.payments||[]).length===1?'Advance Paid':'Partially Paid'};
const startD=b=>(b.pickup||'').slice(0,10),endD=b=>addDays(startD(b),Math.max(1,+b.days||1)-1);
const live=b=>b.status!=='Cancelled';
const tagc=s=>s==='Cancelled'||s==='Pending'?'x':s==='Trip Completed'||s==='Fully Paid'?'':s==='New Booking'?'n':'o';
function nav(){$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t,keep){S.tab=t;if(!keep)S.edit=null;nav();render();scrollTo(0,0)}
function render(){if(!DB){return}const f={dash,new:form,list,veh,drv,cust,rep}[S.tab];$('#app').innerHTML=f()}
function busy(reg,from,to,skip){return S.B.filter(b=>live(b)&&b.status!=='Trip Completed'&&b.id!==skip&&reg&&b.reg&&b.reg.toLowerCase()===reg.toLowerCase()&&startD(b)<=to&&endD(b)>=from)}
function dash(){const t=today(),L=S.B.filter(live);const up=L.filter(b=>startD(b)>t&&b.status!=='Trip Completed'),td=L.filter(b=>startD(b)===t);
const rev=L.reduce((a,b)=>a+grand(b),0),adv=S.B.reduce((a,b)=>a+paid(b),0),pend=L.reduce((a,b)=>a+Math.max(0,bal(b)),0);
const avail=S.V.filter(v=>v.status!=='Maintenance'&&!busy(v.reg,t,t).length).length;
const st=(n,l,o)=>`<div class="card stat ${o?'o':''}"><b>${n}</b><span>${l}</span></div>`;
return `<div class="grid">${st(td.length,'Today’s bookings')}${st(up.length,'Upcoming bookings')}${st(S.B.filter(b=>b.status==='Trip Completed').length,'Completed trips')}${st(S.B.filter(b=>b.status==='Cancelled').length,'Cancelled',1)}
${st(inr(rev),'Total booking revenue')}${st(inr(adv),'Advance / payments received')}${st(inr(pend),'Pending customer payments',1)}${st(avail+' / '+S.V.length,'Vehicles available today')}</div>
<div class="row"><button class="btn o" onclick="go('new')">+ New Booking</button><button class="btn l" onclick="go('list')">All Bookings</button></div>
<div class="card"><h2>Today and upcoming trips</h2>${tbl(td.concat(up).sort((a,b)=>a.pickup>b.pickup?1:-1).slice(0,12))}</div>`}
function tbl(L){if(!L.length)return'<div class="msg">No bookings to show.</div>';
return `<div class="wrap"><table><tr><th>ID</th><th>Customer</th><th>Pickup</th><th>Route</th><th>Amount</th><th>Balance</th><th>Status</th><th></th></tr>${L.map(b=>`<tr><td><b>${esc(b.id)}</b></td><td>${esc(b.name)}<br><span class="muted">${esc(b.mobile)}</span></td><td>${dfmt(b.pickup)}</td><td>${esc(b.from)} → ${esc(b.to)}</td><td>${inr(grand(b))}</td><td>${inr(bal(b))}<br><span class="tag ${tagc(pstat(b))}">${pstat(b)}</span></td><td><span class="tag ${tagc(b.status)}">${esc(b.status)}</span></td><td><button class="btn s" onclick="view('${esc(b.id)}')">View</button></td></tr>`).join('')}</table></div>`}
function list(){let L=S.B.slice().sort((a,b)=>(b.created||'')>(a.created||'')?1:-1);const q=S.q.toLowerCase();
if(q)L=L.filter(b=>(b.name||'').toLowerCase().includes(q)||(b.mobile||'').includes(q)||(b.id||'').toLowerCase().includes(q));
if(S.fb)L=L.filter(b=>b.bdate===S.fb);if(S.ft)L=L.filter(b=>startD(b)===S.ft);
return `<div class="card"><h2>Bookings (${L.length})</h2><div class="f"><div><label>Search name / mobile / ID</label><input value="${esc(S.q)}" oninput="S.q=this.value;keepList(this)"></div>
<div><label>Booking date</label><input type="date" value="${S.fb}" onchange="S.fb=this.value;render()"></div><div><label>Travel date</label><input type="date" value="${S.ft}" onchange="S.ft=this.value;render()"></div></div>
<div class="row"><button class="btn l s" onclick="S.q=S.fb=S.ft='';render()">Clear filters</button><button class="btn s" onclick="exportCsv()">Export to Excel</button><button class="btn l s" onclick="backup()">Backup (JSON)</button></div></div><div class="card">${tbl(L)}</div>`}
function keepList(el){const p=el.selectionStart;render();const i=$('#app input');i.focus();i.setSelectionRange(p,p)}
function fld(id,l,v,t='text',x=''){return `<div><label>${l}</label><input id="f_${id}" type="${t}" value="${esc(v)}" ${x}></div>`}
function sel(id,l,opts,v,x=''){return `<div><label>${l}</label><select id="f_${id}" ${x}>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function form(){const e=S.edit,b=e?S.B.find(x=>x.id===e)||{}:{};const g=k=>b[k]??'';
const vopts=['— choose saved vehicle —'].concat(S.V.map(v=>v.name+' · '+v.reg));
return `<div class="card"><h2>${e?'Edit booking '+esc(e):'New Taxi / Tour Reservation'}</h2>
<h3>Customer</h3><div class="f">${fld('name','Customer name *',g('name'))}${fld('mobile','Mobile number *',g('mobile'),'tel')}${fld('wa','WhatsApp number',g('wa'),'tel')}${fld('email','Email (optional)',g('email'),'email')}</div>
